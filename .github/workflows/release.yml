name: release

# Triggered by pushing a version tag (`jj git push --tag v0.3.12`).
#
# Builds release artifacts for jj-gt, attaches them to a GitHub
# Release, bumps Formula/jj-gt.rb in the consolidated Homebrew tap
# repo (mattwilkinsonn/homebrew-tap), and publishes the crate to
# crates.io. The per-platform tarballs are named so the Homebrew
# formula can find its own platform-specific download.

"on":
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re-)build a release for. Must already exist."
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # ----- Compute the version we're releasing.
  meta:
    name: Compute release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - id: tag
        env:
          TAG_INPUT: ${{ inputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
              tag="$TAG_INPUT"
          else
              tag="${GITHUB_REF_NAME}"
          fi
          case "$tag" in *[$'\n\r']*) echo "error: tag contains a newline" >&2; exit 1 ;; esac
          [[ "$tag" =~ ^v[0-9][A-Za-z0-9._-]*$ ]] || { echo "error: invalid tag: $tag" >&2; exit 1; }
          version="${tag#v}"
          if [[ "$tag" == *-* ]]; then
              prerelease=true
          else
              prerelease=false
          fi
          {
              echo "tag=${tag}"
              echo "version=${version}"
              echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

  # ----- Build the jj-gt binary.
  #
  # Per-target matrix keyed on (target_name, runs_on, rust_target).
  # macOS-latest is Apple Silicon (arm64); Linux runners cover x64
  # and arm64 separately.
  build-rust:
    name: Build Rust (${{ matrix.target_name }})
    needs: [meta]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_name: darwin-arm64
            runs_on: macos-latest
            rust_target: aarch64-apple-darwin
          - target_name: linux-x64
            runs_on: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
          - target_name: linux-arm64
            runs_on: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install stable
          rustup target add ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-${{ matrix.target_name }}"

      - name: Build release binary (jj-gt)
        run: |
          cargo build --release --target ${{ matrix.rust_target }} --bin jj-gt

      # ----- Stage + tar jj-gt's artifacts.
      #
      # The tarball is named after the slug the Homebrew formula
      # expects: jj-gt-v<X>-<slug>.tar.gz (contains jj-gt).
      #
      # Codesigning on macOS is ad-hoc (`codesign -s -`) so the
      # binary doesn't get the "downloaded from internet" quarantine
      # warning. Real Developer-ID signing needs an Apple cert pair
      # in secrets and is out-of-scope for an MVP-stage release.
      - name: Stage jj-gt artifacts
        id: stage_jj_gt
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          ver="$VER"
          stage="$RUNNER_TEMP/jj-gt-v${ver}-${{ matrix.target_name }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.rust_target }}/release/jj-gt" "$stage/"
          cp README.md "$stage/"
          cp LICENSE-MIT LICENSE-APACHE "$stage/"
          echo "dir=$stage" >> "$GITHUB_OUTPUT"

      - name: Codesign (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign -s - "${{ steps.stage_jj_gt.outputs.dir }}/jj-gt"

      - name: Tar + sha256
        id: pack
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          ver="$VER"
          for tool in jj-gt; do
              stage="$RUNNER_TEMP/${tool}-v${ver}-${{ matrix.target_name }}"
              tar -C "$(dirname "$stage")" -czf "$stage.tar.gz" "$(basename "$stage")"
              (cd "$(dirname "$stage")" && shasum -a 256 "$(basename "$stage").tar.gz" > "$(basename "$stage").tar.gz.sha256")
          done

      - name: Upload Rust artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rust-${{ matrix.target_name }}
          path: |
            ${{ runner.temp }}/jj-gt-v*.tar.gz
            ${{ runner.temp }}/jj-gt-v*.sha256
          if-no-files-found: error

  # ----- Create the GitHub Release and attach every tarball.
  publish-release:
    name: Publish GitHub Release
    needs: [meta, build-rust]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.sha256' \) \
              -exec cp {} release/ \;
          ls -la release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(
            --repo "$GITHUB_REPOSITORY"
            --title "$TAG"
            --notes "Release $TAG. See CHANGELOG.md for details."
            --verify-tag
          )
          if [ "$PRERELEASE" = "true" ]; then
              args+=(--prerelease)
          fi
          # `gh release create` hard-fails when the Release already exists,
          # which cascades skips into bump-tap + publish-crates on any
          # workflow_dispatch re-run. Create only when absent; the assets
          # are pushed by the upload step below with --clobber, so a first
          # run and a re-run converge on the same asset set.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              || gh release create "$TAG" "${args[@]}"

      # Runs on every release, pre-existing or freshly created, so the
      # assets are refreshed idempotently rather than only attached by the
      # one-shot create.
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
              release/jj-gt-v*.tar.gz \
              release/jj-gt-v*.sha256 \
              --clobber --repo "$GITHUB_REPOSITORY"

  # ----- Bump Formula/jj-gt.rb in mattwilkinsonn/homebrew-tap with the
  # new version + sha256s.
  bump-tap:
    name: Bump Homebrew tap formulae
    needs: [meta, build-rust, publish-release]
    runs-on: ubuntu-latest
    # Skip prereleases — tap should only track stable.
    if: needs.meta.outputs.prerelease == 'false'
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Mint a short-lived (~1 hour) installation token for the
      # zireael-release GitHub App. The App is in the bypass actors
      # list for the main-branch ruleset, so its pushes skip the
      # PR-required + status-checks-required gates. Default
      # GITHUB_TOKEN can't push to main (correctly — it's the same
      # cred every workflow gets, and you don't want every workflow
      # bypassing branch protection).
      #
      # App configuration:
      #   - App ID:        ${{ vars.RELEASE_BOT_APP_ID }}     (repo variable)
      #   - Private key:   ${{ secrets.RELEASE_BOT_PRIVATE_KEY }} (repo secret)
      #   - Permissions:   contents:write + metadata:read (least-privilege)
      #   - Installed on:  this repo + mattwilkinsonn/homebrew-tap
      #                    (the formula bump commits land in the tap)
      #   - Bypass actor:  main branch ruleset
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: mattwilkinsonn
          # `repositories:` REPLACES the current-repo default rather than
          # extending it, so this repo has to be listed alongside the tap
          # or the self checkout that reuses this token fails to auth.
          repositories: |
            jj-gt
            homebrew-tap

      - uses: actions/checkout@v6
        with:
          # First checkout: this repo, solely to supply
          # .github/scripts/bump-formulae.py to the rewrite step below. The
          # formula it rewrites lives in the tap checkout that follows.
          ref: main
          # Retained as-is; the tap checkout below carries its own
          # fetch-depth: 0 for the rebase in Commit + push.
          fetch-depth: 0
          # Kept on the App token so both checkouts share one credential.
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@v6
        with:
          # Second checkout: the consolidated tap repo, where the formula
          # now lives. The bump rewrites tap/Formula/jj-gt.rb and pushes to
          # the tap's main; the self checkout above only supplies
          # .github/scripts/bump-formulae.py.
          repository: mattwilkinsonn/homebrew-tap
          path: tap
          ref: main
          # fetch-depth: 0 is required — Commit + push rebases onto
          # origin/main, which fails across a depth-1 shallow boundary.
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Extract per-platform SHA256s for every tool
        id: shas
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          ver="$VER"
          for tool in jj-gt; do
              for slug in darwin-arm64 linux-x64 linux-arm64; do
                  # Find the .sha256 file; artifact-name prefix varies
                  # (rust-*) so just glob.
                  file=$(find artifacts -name "${tool}-v${ver}-${slug}.tar.gz.sha256" | head -1)
                  if [ -z "$file" ]; then
                      echo "error: missing sha256 for ${tool} ${slug}" >&2
                      exit 1
                  fi
                  sha=$(awk '{print $1}' "$file")
                  echo "${tool}-${slug}=${sha}" >> "$GITHUB_OUTPUT"
              done
          done

      # Fail closed. bump-formulae.py skips a missing formula and returns
      # 0, and Commit + push's own `git diff --quiet Formula/` then exits 0
      # with "nothing to bump" — so a missing or disabled tap formula would
      # otherwise produce a GREEN bump-tap that shipped nothing.
      - name: Verify the tap formula is present and enabled
        run: |
          set -euo pipefail
          if [ ! -f tap/Formula/jj-gt.rb ]; then
              echo "error: Formula/jj-gt.rb not found in mattwilkinsonn/homebrew-tap" >&2
              exit 1
          fi
          if grep -qE '^[[:space:]]*disable!' tap/Formula/jj-gt.rb; then
              echo "error: tap Formula/jj-gt.rb is disabled; revive it before bumping" >&2
              exit 1
          fi

      - name: Rewrite the tap formula in-place
        env:
          VER: ${{ needs.meta.outputs.version }}
          # Pass every per-tool-per-slug sha as one env var per
          # entry. The python script reads them into a dict and
          # rewrites each formula.
          JJ_GT_DARWIN_ARM64: ${{ steps.shas.outputs.jj-gt-darwin-arm64 }}
          JJ_GT_LINUX_X64: ${{ steps.shas.outputs.jj-gt-linux-x64 }}
          JJ_GT_LINUX_ARM64: ${{ steps.shas.outputs.jj-gt-linux-arm64 }}
        # CWD must be the tap checkout: the script resolves Path("Formula")
        # relative to CWD. The script itself lives in the self checkout at
        # the workspace root.
        working-directory: tap
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/bump-formulae.py"

      - name: Commit + push
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        # Run in the tap checkout so `origin` is mattwilkinsonn/homebrew-tap.
        working-directory: tap
        run: |
          set -euo pipefail
          if git diff --quiet Formula/; then
              echo "nothing to bump"
              exit 0
          fi
          # Author the commit as the App's bot identity. The App
          # slug is `zireael-release` (visible at
          # https://github.com/apps/zireael-release), so the noreply
          # email follows the standard `<id>+<slug>[bot]@...` form.
          # The numeric ID matches the App ID (vars.RELEASE_BOT_APP_ID)
          # — every GitHub App gets a bot user with id == app_id.
          git config user.name "zireael-release[bot]"
          git config user.email "${{ vars.RELEASE_BOT_APP_ID }}+zireael-release[bot]@users.noreply.github.com"
          git add Formula/
          git commit -m "chore(tap): bump formulae to ${TAG}"
          # Main can advance while the release builds artifacts. Rebase the
          # formula bump over the latest main immediately before pushing so
          # the bot push stays a fast-forward instead of leaving the tap stale.
          git fetch origin main:refs/remotes/origin/main
          git rebase origin/main
          git push origin HEAD:main

  # ----- Validate the freshly published tap installs end-to-end.
  validate-tap:
    name: Validate tap (${{ matrix.os }})
    needs: [meta, bump-tap]
    if: needs.meta.outputs.prerelease == 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
      - name: Tap, install, and test every formula
        run: |
          set -euo pipefail
          brew tap mattwilkinsonn/tap
          brew trust mattwilkinsonn/tap
          for formula in jj-gt; do
            echo "::group::${formula}"
            brew install "mattwilkinsonn/tap/${formula}"
            brew test "mattwilkinsonn/tap/${formula}"
            echo "::endgroup::"
          done

  # ----- Publish to crates.io.
  #
  # jj-gt depends on jj-hooks 0.3.11, which is already published to
  # crates.io, so there's no internal dependency to publish first and
  # no wait-for-index step.
  publish-crates:
    name: Publish to crates.io
    needs: [meta, build-rust, publish-release, validate-tap]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: needs.meta.outputs.prerelease == 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install stable

      - name: cargo publish jj-gt
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p jj-gt --locked

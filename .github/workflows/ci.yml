# jj-gt CI — EJECTED from the dev-shared reusable workflow because jj-gt needs its own job
# graph (its own gate wiring + the standalone toolchain pin). Shares only the setup-devenv
# composite action for the bootstrap.
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # the Determinate Nix action needs OIDC
    steps:
      - uses: actions/checkout@v6
      - uses: mattwilkinsonn/dev-shared/setup-devenv@v1
      - name: devenv tasks run ci
        run: devenv shell -- devenv tasks run ci
